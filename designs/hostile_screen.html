<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Kiwi - Connection Blocked (Minimalist Light)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .font-sans-sub {
      font-family: 'Inter', sans-serif;
    }
    @keyframes subtle-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.08);
        opacity: 0.85;
      }
    }
    @keyframes outer-pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.3;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.55;
      }
    }
    .animate-ring-inner {
      animation: subtle-pulse 3.8s ease-in-out infinite;
    }
    .animate-ring-outer {
      animation: outer-pulse 4.4s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FEF2F2] min-h-screen text-slate-800 flex flex-col justify-between items-center p-6 sm:p-8 relative overflow-hidden select-none max-w-[390px] mx-auto">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center -z-10">
<div class="w-[340px] h-[340px] rounded-full bg-red-100/60 blur-3xl"></div>
</div>
<!-- Top Header -->
<header class="w-full max-w-sm flex items-center justify-between pt-2">
<!-- Brand Logo Minimal -->
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full bg-white shadow-xs border border-red-100/80 flex items-center justify-center text-[#EF4444]">
<span class="material-symbols-outlined text-[18px]">shield</span>
</div>
<span class="font-bold text-[18px] tracking-tight text-slate-900">Kiwi</span>
</div>
<!-- Status Badge -->
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/90 border border-red-100 shadow-xs">
<span class="w-2 h-2 rounded-full bg-[#EF4444] animate-ping"></span>
<span class="font-sans-sub text-[11px] font-semibold text-[#EF4444] tracking-wider uppercase">Isolated</span>
</div>
</header>
<!-- Center Content -->
<main class="w-full max-w-sm flex flex-col items-center justify-center my-auto py-8 text-center">
<!-- Concentric Rings & Wi-Fi Icon Graphic -->
<div class="relative w-64 h-64 flex items-center justify-center mb-8">
<!-- Outermost Pulse Ring -->
<div class="absolute w-56 h-56 rounded-full border border-red-200/50 animate-ring-outer"></div>
<!-- Middle Ring with glow -->
<div class="absolute w-44 h-44 rounded-full border border-red-200/80 bg-red-50/40 animate-ring-inner"></div>
<!-- Center White Circle with Shadow -->
<div class="relative w-28 h-28 rounded-full bg-white shadow-lg shadow-red-500/10 border border-red-100/70 flex items-center justify-center z-10 transition-transform active:scale-95 duration-200">
<!-- Wi-Fi Off / Blocked Icon -->
<div class="text-[#EF4444] flex items-center justify-center">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 0, 'wght' 450;">wifi_off</span>
</div>
<!-- Warning Alert Badge Overlay -->
<div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[#EF4444] text-white flex items-center justify-center shadow-md shadow-red-500/30 border-2 border-white">
<span class="material-symbols-outlined text-[17px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">priority_high</span>
</div>
</div>
</div>
<!-- Typography Content -->
<div class="space-y-2 px-2">
<h1 class="text-[26px] sm:text-[28px] font-bold text-slate-900 tracking-tight leading-tight">
        Connection Blocked
      </h1>
<p class="font-sans-sub text-[13.5px] leading-relaxed text-slate-500 max-w-[260px] mx-auto font-medium">
        No Hardware Signature Detected<br/>
<span class="text-[#DC2626] font-semibold text-[12.5px] tracking-wide inline-block mt-1 bg-red-50 px-2.5 py-0.5 rounded-full border border-red-100/80">Evil Twin Attack</span>
</p>
</div>
</main>
<!-- Bottom CTA Controls -->
<footer class="w-full max-w-sm flex flex-col items-center gap-3 pb-4">
<!-- Sleek Red Pill Button -->
<button class="w-full py-4 px-6 rounded-full bg-[#EF4444] hover:bg-[#DC2626] active:scale-[0.98] text-white font-semibold text-[15px] shadow-lg shadow-red-500/25 flex items-center justify-center gap-2 transition-all duration-150">
<span class="material-symbols-outlined text-[19px]">block</span>
<span>Blocked for Safety</span>
</button>
<!-- Subtle Small Gray Link -->
<button class="font-sans-sub text-[13px] text-slate-400 hover:text-slate-600 transition-colors py-1 flex items-center gap-1 font-medium group">
<span>Advanced Bypass</span>
<span class="material-symbols-outlined text-[14px] text-slate-400 group-hover:translate-x-0.5 transition-transform">chevron_right</span>
</button>
<!-- Subtle Micro Footer Text -->
<div class="font-mono text-[10px] text-slate-400 tracking-wider uppercase pt-1">
      802.11ax • Zero-Trust Mode
    </div>
</footer>
</body>
</html>
