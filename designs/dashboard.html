<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Kiwi - Mobile Dashboard Design</title>
  <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appbg: '#BAC0B9',
            cardbg: '#FFFFFF',
            charcoal: '#151719',
            subtleGreen: '#8ce2a8',
            searchbg: '#D9DED8',
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      user-select: none;
    }
    .headline-leading {
      line-height: 1.08;
      letter-spacing: -0.03em;
    }
    .bg-kiwi-watermark {
      position: absolute;
      right: -25px;
      bottom: -15px;
      width: 250px;
      height: auto;
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body class="bg-stone-300 min-h-screen flex items-center justify-center p-0 md:p-6 font-sans">
  <!-- Mobile Device Frame -->
  <div class="relative w-full max-w-[390px] h-[844px] bg-[#BAC0B9] text-charcoal flex flex-col justify-between overflow-hidden shadow-2xl md:rounded-[48px] border-0 md:border-[8px] md:border-[#1E2022] box-border">
    
    <!-- Background Watermark Illustration -->
    <svg class="bg-kiwi-watermark" fill="none" viewBox="0 0 200 170" xmlns="http://www.w3.org/2000/svg">
      <path d="M125 125 C80 145, 25 115, 25 75 C25 35, 75 18, 115 28 C145 35, 170 65, 155 105 C145 120, 135 123, 125 125 Z" stroke="#151719" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.8"></path>
      <circle cx="118" cy="48" fill="#151719" r="3.2"></circle>
      <path d="M142 56 C168 62, 195 78, 215 108" stroke="#151719" stroke-linecap="round" stroke-width="4.2"></path>
      <path d="M52 68 C45 88, 62 104, 86 101" stroke="#151719" stroke-linecap="round" stroke-width="4"></path>
      <path d="M72 125 L65 152 M55 154 L76 151 M98 120 L94 147 M86 148 L106 146" stroke="#151719" stroke-linecap="round" stroke-linejoin="round" stroke-width="4.2"></path>
    </svg>

    <!-- Top Region (Status Bar & Header) -->
    <div class="relative z-10 w-full pt-3 px-6">
      <!-- iOS Status Bar -->
      <header class="flex justify-between items-center text-charcoal h-6 text-sm font-semibold tracking-tight">
        <span class="text-[15px] font-semibold tracking-tight ml-1">9:41</span>
        <div class="w-24 h-5 bg-black rounded-full mx-auto -mt-1 hidden xs:block"></div>
        <div class="flex items-center space-x-1.5 mr-1">
          <svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 17 12">
            <rect height="3.5" rx="0.6" width="2.6" x="0" y="8.5"></rect>
            <rect height="6" rx="0.6" width="2.6" x="4.4" y="6"></rect>
            <rect height="8.5" rx="0.6" width="2.6" x="8.8" y="3.5"></rect>
            <rect height="11.5" rx="0.6" width="2.6" x="13.2" y="0.5"></rect>
          </svg>
          <svg class="w-4 h-3.5" fill="currentColor" viewBox="0 0 18 13">
            <path clip-rule="evenodd" d="M9 2.5C12.1 2.5 14.9 3.7 17 5.7L18 4.7C15.6 2.4 12.5 1 9 1C5.5 1 2.4 2.4 0 4.7L1 5.7C3.1 3.7 5.9 2.5 9 2.5ZM9 6.2C11.1 6.2 13 7 14.5 8.3L15.5 7.3C13.7 5.7 11.5 4.7 9 4.7C6.5 4.7 4.3 5.7 2.5 7.3L3.5 8.3C5 7 6.9 6.2 9 6.2ZM9 9.8C10.1 9.8 11.2 10.3 12 11L9 14L6 11C6.8 10.3 7.9 9.8 9 9.8Z" fill-rule="evenodd"></path>
          </svg>
          <div class="flex items-center pl-0.5">
            <div class="w-6 h-3 rounded-[3.5px] border border-charcoal/90 p-[1px] flex items-center">
              <div class="h-full w-full bg-charcoal rounded-[1.5px]"></div>
            </div>
            <div class="w-0.5 h-1.5 bg-charcoal/90 rounded-r-[1px] -ml-[0.5px]"></div>
          </div>
        </div>
      </header>

      <!-- Brand Icon & Headline -->
      <div class="mt-4">
        <!-- Kiwi Bird Logo Icon -->
        <div class="mb-3">
          <svg class="w-16 h-16 text-charcoal" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewBox="0 0 100 80">
            <path d="M60 55 C38 65, 12 50, 12 32 C12 14, 36 6, 56 11 C70 14, 82 28, 75 46 C70 53, 65 54, 60 55 Z"></path>
            <circle cx="58" cy="20" fill="currentColor" r="1.5"></circle>
            <path d="M70 24 C82 27, 95 35, 105 49" stroke-width="2.5"></path>
            <path d="M25 30 C22 39, 30 46, 42 45" stroke-width="2.5"></path>
            <path d="M35 55 L32 67 M27 68 L37 66 M48 53 L46 65 M42 66 L52 64" stroke-width="2.5"></path>
          </svg>
        </div>
        <!-- Headline -->
        <h1 class="text-[34px] font-extrabold text-charcoal tracking-tight headline-leading">
          Hi User,<br/>
          Let's secure your<br/>
          connection.
        </h1>
      </div>
    </div>

    <!-- Main Grid -->
    <main class="relative z-10 px-5 flex-1 flex flex-col justify-center py-2">
      <div class="grid grid-cols-2 gap-3.5">
        <!-- CARD 1: Kiwi Scan -->
        <section class="bg-cardbg rounded-3xl p-4 flex flex-col justify-between h-[134px] shadow-sm cursor-pointer hover:scale-[1.02] transition-transform">
          <div>
            <div class="w-9 h-9 flex items-center justify-center text-charcoal">
              <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="12"></circle>
                <circle cx="16" cy="16" r="7"></circle>
                <path d="M13 16 L15.5 18.5 L20 13.5" stroke-width="2.2"></path>
              </svg>
            </div>
          </div>
          <div>
            <h2 class="text-[17px] font-bold text-charcoal tracking-tight leading-tight">Kiwi Scan</h2>
            <p class="text-[11px] text-gray-500 font-medium tracking-tight mt-0.5">Check Wi-Fi for anchor</p>
          </div>
        </section>

        <!-- CARD 2: Connection Status -->
        <section class="bg-cardbg rounded-3xl p-4 flex flex-col justify-between h-[134px] shadow-sm cursor-pointer hover:scale-[1.02] transition-transform">
          <div>
            <div class="w-9 h-9 rounded-full bg-[#8de2a8]/80 flex items-center justify-center">
              <svg class="w-4 h-4 text-[#113a21]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" viewBox="0 0 24 24">
                <rect height="10" rx="2" width="14" x="5" y="11"></rect>
                <path d="M8 11 V7 a4 4 0 0 1 8 0 v4"></path>
              </svg>
            </div>
          </div>
          <div>
            <h2 class="text-[17px] font-bold text-charcoal tracking-tight leading-tight">Connection<br/>Status</h2>
            <p class="text-[11px] text-gray-600 font-medium tracking-tight mt-0.5 flex items-center">
              <span>Current: Secured (Green)</span>
            </p>
          </div>
        </section>

        <!-- CARD 3: Saved Anchors -->
        <section class="bg-cardbg rounded-3xl p-4 flex flex-col justify-between h-[134px] shadow-sm cursor-pointer hover:scale-[1.02] transition-transform">
          <div>
            <div class="w-9 h-9 flex items-center justify-center text-charcoal">
              <svg class="w-6 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 28">
                <path d="M4 3 H20 V25 L12 19 L4 25 Z"></path>
              </svg>
            </div>
          </div>
          <div>
            <h2 class="text-[17px] font-bold text-charcoal tracking-tight leading-tight">Saved anchors</h2>
          </div>
        </section>

        <!-- CARD 4: Location -->
        <section class="bg-cardbg rounded-3xl p-4 flex flex-col justify-between h-[134px] shadow-sm cursor-pointer hover:scale-[1.02] transition-transform">
          <div>
            <div class="w-9 h-9 flex items-center justify-center text-charcoal">
              <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24">
                <path d="M12 21 C12 21 19 14.5 19 9.5 C19 5.6 15.9 2.5 12 2.5 C8.1 2.5 5 5.6 5 9.5 C5 14.5 12 21 12 21 Z"></path>
                <circle cx="12" cy="9.5" r="3"></circle>
              </svg>
            </div>
          </div>
          <div>
            <h2 class="text-[17px] font-bold text-charcoal tracking-tight leading-tight">Location</h2>
            <p class="text-[11px] text-gray-500 font-medium tracking-tight mt-0.5">Set campus area</p>
          </div>
        </section>
      </div>
    </main>

  </div>
</body>
</html>
